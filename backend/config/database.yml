default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: spoiler_free_development

test:
  <<: *default
  database: spoiler_free_test

# Single database: the app tables plus Solid Queue / Solid Cache all live here.
# Set DATABASE_URL in the deploy environment.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
